# Acquires an Azure DevOps token through the ARM (Workload Identity Federation) service connection
# and stores it as the credential for the private feed in the agent's copy of src/nuget.config.
# Include this in every job that restores packages, before any NuGet / dotnet restore step.

parameters:
- name: serviceConnection
  type: string
  default: 'a11y-insights-public-feed-identity-axe-windows'
- name: sourceName          # Must match the <add key="..."> value in src/nuget.config
  type: string
  default: 'a11y-insights-public'
- name: nugetConfigPath
  type: string
  default: '$(Build.SourcesDirectory)/src/nuget.config'

steps:
- task: AzureCLI@2
  displayName: 'Authenticate to ${{ parameters.sourceName }} feed'
  inputs:
    azureSubscription: ${{ parameters.serviceConnection }}
    scriptType: pscore
    scriptLocation: inlineScript
    inlineScript: |
      $token = az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv
      if (-not $token) { throw 'Failed to acquire Azure DevOps token' }
      Write-Host "##vso[task.setsecret]$token"
      dotnet nuget update source '${{ parameters.sourceName }}' `
        --username az `
        --password $token `
        --store-password-in-clear-text `
        --configfile '${{ parameters.nugetConfigPath }}'
      if ($LASTEXITCODE -ne 0) { throw 'Failed to store feed credential in nuget.config' }