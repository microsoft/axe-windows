name: $(date:yyyy-MM-dd)$(rev:.rr)
trigger: none
pr: none
variables:
  BuildPlatform: "x86"
  CreateAxeWindowsNugetPackage: "true"
  CreateAxeWindowsZippedCLI: "true"
  PublicRelease: "false"
  SignAppForRelease: "false"
# The `resources` specify the location and version of the 1ES PT.
resources:
  repositories:
    - repository: 1esPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release
extends:
  # The pipeline extends the 1ES PT which will inject different SDL and compliance tasks.
  # For non-production pipelines, use "Unofficial" as defined below.
  # For productions pipelines, use "Official".
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1esPipelines
  parameters:
    settings:
      skipBuildTagsForGitHubPullRequests: true
    # Update the pool with your team's 1ES hosted pool.
    pool:
      name: $(a11yInsightsPool) # Name of your hosted pool
      image: windows-2022-secure # Name of the image in your pool. If not specified, first image of the pool is used
      os: windows # OS of the image. Allowed values: windows, linux, macOS
    sdl:
      codeql:
        compiled:
          enabled: true
      binskim:
        enabled: false
    stages:
      - stage: Stage
        jobs:
          - job: Release
            templateContext:
              outputs:
                - output: buildArtifacts
                  artifactName: drop
                  displayName: "Publish Artifact: drop"
                  PathtoPublish: "$(Build.ArtifactStagingDirectory)"
                - output: pipelineArtifact
                  artifactName: ASA-Results
                  targetPath: "$(Build.ArtifactStagingDirectory)/ASA"
                  displayName: "Publish ASA Results"
            pool:
              name: $(a11yInsightsPool)
              image: windows-2022-secure
              os: windows
            steps:
              - task: NuGetToolInstaller@1
                displayName: "Use NuGet 5.x"
                inputs:
                  versionSpec: "5.x"

              - task: NuGetCommand@2
                displayName: "NuGet restore"

              - task: DotNetCoreCLI@2
                displayName: "dotnet restore"
                inputs:
                  command: restore
                  projects: |
                    **\*.csproj

              - task: PowerShell@2
                displayName: "License Header Check"
                inputs:
                  targetType: "filePath"
                  filePath: tools\scripts\verification.scripts\LicenseHeaderVerification.ps1
                  arguments: '-target  $(Build.Repository.LocalPath) -licenseHeaderPath tools\scripts\verification.scripts\LicenseHeader.txt -extensions *.xaml,*.xml,*.cs,*.ps1,*.yml.*.targets -addIfAbsent $false'

              - task: PowerShell@2
                displayName: "Resource String Translator Comment Check"
                inputs:
                  targetType: "filePath"
                  filePath: tools\scripts\verification.scripts\ResourceStringCommentVerification.ps1
                  arguments: "-target  $(Build.Repository.LocalPath)"

              - task: VSBuild@1
                displayName: 'Build Solution **\*.sln'
                inputs:
                  vsVersion: 17.0
                  platform: "$(BuildPlatform)"
                  configuration: release

              # Attack Surface Analyzer (ASA) - Task 2: 1CS Compliance Requirement
              - task: PowerShell@2
                displayName: 'Install Attack Surface Analyzer'
                inputs:
                  targetType: 'inline'
                  script: |
                    Write-Host "Installing Attack Surface Analyzer (ASA) tool..."
                    dotnet tool install -g Microsoft.CST.AttackSurfaceAnalyzer.CLI
                    Write-Host "ASA installed successfully"
                    asa --version

              - task: PowerShell@2
                displayName: 'ASA Baseline Scan (Pre-Install)'
                inputs:
                  targetType: 'inline'
                  script: |
                    Write-Host "Running ASA baseline scan before MSI installation..."
                    asa collect -a
                    Write-Host "Baseline scan completed. Run ID saved for comparison."

              - task: PowerShell@2
                displayName: 'Install MSI for ASA Analysis'
                inputs:
                  targetType: 'inline'
                  script: |
                    $msiPath = Get-ChildItem -Path "$(Build.SourcesDirectory)\src\CLI_Installer\bin\x86\Release" -Filter "AxeWindowsCLI.msi" -Recurse | Select-Object -First 1 -ExpandProperty FullName
                    if ($msiPath) {
                      Write-Host "Installing MSI from: $msiPath"
                      Start-Process msiexec.exe -ArgumentList "/i `"$msiPath`" /quiet /norestart /l*v `"$(Build.ArtifactStagingDirectory)\msi_install.log`"" -Wait -NoNewWindow
                      Write-Host "MSI installation completed for ASA analysis"
                    } else {
                      Write-Warning "AxeWindowsCLI.msi not found! Skipping ASA analysis."
                    }

              - task: PowerShell@2
                displayName: 'ASA Post-Install Scan'
                inputs:
                  targetType: 'inline'
                  script: |
                    Write-Host "Running ASA post-install scan..."
                    asa collect --match-run-id
                    Write-Host "Post-install scan completed"

              - task: PowerShell@2
                displayName: 'ASA Export Results'
                inputs:
                  targetType: 'inline'
                  script: |
                    Write-Host "Exporting ASA results to SARIF format..."
                    $outputDir = "$(Build.ArtifactStagingDirectory)\ASA"
                    New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
                    asa export-collect --outputsarif --outputpath "$outputDir\asa-results.sarif"
                    Write-Host "ASA results exported to: $outputDir\asa-results.sarif"

              - task: PowerShell@2
                displayName: 'Uninstall MSI After ASA Analysis'
                inputs:
                  targetType: 'inline'
                  script: |
                    Write-Host "Uninstalling MSI to restore clean state..."
                    $msiPath = Get-ChildItem -Path "$(Build.SourcesDirectory)\src\CLI_Installer\bin\x86\Release" -Filter "AxeWindowsCLI.msi" -Recurse | Select-Object -First 1 -ExpandProperty FullName
                    if ($msiPath) {
                      Start-Process msiexec.exe -ArgumentList "/x `"$msiPath`" /quiet /norestart" -Wait -NoNewWindow
                      Write-Host "MSI uninstalled successfully"
                    }

              - task: PowerShell@2
                displayName: 'Validate ASA Results (Warning Mode)'
                inputs:
                  targetType: 'inline'
                  script: |
                    Write-Host "Validating ASA SARIF results for security issues..."
                    $sarifPath = "$(Build.ArtifactStagingDirectory)\ASA\asa-results.sarif"
                    
                    if (Test-Path $sarifPath) {
                      $sarifContent = Get-Content $sarifPath -Raw | ConvertFrom-Json
                      $issueCount = 0
                      
                      if ($sarifContent.runs -and $sarifContent.runs.Count -gt 0) {
                        foreach ($run in $sarifContent.runs) {
                          if ($run.results) {
                            $issueCount += $run.results.Count
                          }
                        }
                      }
                      
                      Write-Host "ASA found $issueCount potential security issues"
                      
                      if ($issueCount -gt 0) {
                        Write-Host "##vso[task.logissue type=warning]ASA detected $issueCount security configuration changes. Review the ASA-Results artifact for details."
                        Write-Host "For 1CS compliance (Task 2), all ASA issues must be reviewed and addressed."
                      } else {
                        Write-Host "##vso[task.complete result=Succeeded;]No ASA security issues detected - 1CS compliant!"
                      }
                    } else {
                      Write-Warning "ASA SARIF file not found at: $sarifPath"
                    }

              - task: CopyFiles@2
                displayName: "Copy Files to: $(Build.ArtifactStagingDirectory)"
                inputs:
                  Contents: '**\bin\release\**'
                  TargetFolder: "$(Build.ArtifactStagingDirectory)"

              - task: DotNetCoreCLI@2
                displayName: 'Test Assemblies (.NET Core) **\*test*.csproj'
                inputs:
                  arguments: --no-build --blame --verbosity normal --configuration release
                  command: test
                  projects: |
                    **\*test*.csproj

          - job: Debug
            templateContext:
              outputs:
                - output: buildArtifacts
                  artifactName: drop
                  displayName: "Publish Artifact: drop"
                  PathtoPublish: "$(Build.ArtifactStagingDirectory)"
            pool:
              name: $(a11yInsightsPool)
              image: windows-2022-secure
              os: windows
            steps:
              - task: NuGetToolInstaller@1
                displayName: "Use NuGet 5.x"
                inputs:
                  versionSpec: "5.x"

              - task: NuGetCommand@2
                displayName: "NuGet restore"

              - task: DotNetCoreCLI@2
                displayName: "dotnet restore"
                inputs:
                  command: restore
                  projects: |
                    **\*.csproj

              - task: VSBuild@1
                displayName: 'Build Solution **\*.sln'
                inputs:
                  vsVersion: 17.0
                  platform: "$(BuildPlatform)"
                  configuration: debug

              - task: CopyFiles@2
                displayName: "Copy Files to: $(Build.ArtifactStagingDirectory)"
                inputs:
                  Contents: '**\bin\debug\**'
                  TargetFolder: "$(Build.ArtifactStagingDirectory)"

              - task: DotNetCoreCLI@2
                displayName: 'Test Assemblies (.NET Core) **\*test*.csproj'
                inputs:
                  arguments: --no-build --blame --verbosity normal --configuration debug /p:CollectCoverage=true /p:CoverletOutput=./CodeCoverage/ /p:CoverletOutputFormat=cobertura
                  command: test
                  projects: |
                    **\*test*.csproj

              # Run a command line script using Bash on Linux and macOS and cmd.exe on Windows
              - task: CmdLine@2
                displayName: "Upload coverage to codecov.io"
                inputs:
                  script: $(NUGET_PACKAGES)\codecov\$(CODECOV_VERSION)\tools\win7-x86\codecov.exe -t $(CODECOV_TOKEN) -f **/*coverage.cobertura.xml
                #workingDirectory: # Optional
                #failOnStderr: false # Optional
          - template: build/check-dependencies.yml@self
            parameters:
              configuration: release
